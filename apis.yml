- type: Features
  data:
  - name: Identity
    description: Verify person and business identities against 270+ data sources across 195 markets.
  - name: Onboarding
    description: Configurable Journeys orchestrate KYC, KYB, document verification, and step-up review
      for new customer acquisition.
  - name: Ongoing Monitoring
    description: Perpetual KYC and event-driven monitoring across logins, credential updates, transactions,
      and account changes.
  - name: Fraud
    description: Machine-learning Fraud Signal and integrated device-risk providers detect fraud across
      onboarding and post-onboarding events.
